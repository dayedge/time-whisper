name: Check
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        timezone: [UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh ./gradlew jvmTest --console=plain
  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The tagger model is not in git, so the corpus gate runs on a developer's Mac: `make check`.
      - run: make test swift-test
      - run: make package
      - run: python3 scripts/test_release.py
      - run: python3 scripts/smoke_package.py build/distributions/package
      - uses: actions/upload-artifact@v4
        with:
          name: time-whisper-${{ matrix.runner }}
          path: |
            build/distributions/*.zip
            build/distributions/*.sha256
          retention-days: 3
